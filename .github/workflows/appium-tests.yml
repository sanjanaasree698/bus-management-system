name: Appium Test Analysis Report Generator

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  generate-appium-excel:
    name: Generate Appium Excel Analysis Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Execute Appium Excel Generation Script
        run: |
          python reports/generate_appium_excel.py appium_test_analysis.xlsx

      - name: Publish Appium Coverage Step Summary
        if: always()
        run: |
          if [ -f "appium_summary.md" ]; then
            cat appium_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Appium Test Analysis Excel Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-analysis-excel
          path: appium_test_analysis.xlsx
